{% comment %} common/templates/common/includes/alerts.html {% endcomment %}

<div class="ca-overlay" id="customAlertOverlay">
    <div class="ca-card">
        <button class="ca-x-btn" onclick="closeAlert()" aria-label="Close">&#x2715;</button>
        <div class="ca-icon-circle" id="alertIconCircle">
            <svg class="ca-svg" id="alertSvg" viewBox="0 0 24 24" fill="none"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </div>
        <h2 class="ca-title"   id="alertTitle"></h2>
        <p  class="ca-message" id="alertMessage"></p>
        <button class="ca-pill-btn" id="alertOkBtn" onclick="closeAlert()">OK</button>
    </div>
</div>

<div class="ca-overlay" id="customConfirmOverlay">
    <div class="ca-card">
        <button class="ca-x-btn" onclick="closeConfirm(false)" aria-label="Close">&#x2715;</button>
        <div class="ca-icon-circle" id="confirmIconCircle">
            <svg class="ca-svg" id="confirmSvg" viewBox="0 0 24 24" fill="none"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </div>
        <h2 class="ca-title"   id="confirmTitle"></h2>
        <p  class="ca-message" id="confirmMessage"></p>
        <div class="ca-two-btns">
            <button class="ca-outline-btn" id="confirmCancelBtn" onclick="closeConfirm(false)">Cancel</button>
            <button class="ca-pill-btn ca-pill-sm" id="confirmOkBtn" onclick="closeConfirm(true)">Confirm</button>
        </div>
    </div>
</div>

<div class="ca-toast-stack" id="toastContainer"></div>

<style>
.ca-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.46);
    z-index: 10000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: ca-fade .18s ease;
}
.ca-overlay.show { display: flex; }
@keyframes ca-fade { from { opacity:0 } to { opacity:1 } }
@keyframes ca-up {
    from { opacity:0; transform: translateY(32px) scale(.96) }
    to   { opacity:1; transform: translateY(0)    scale(1)   }
}
.ca-card {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.18);
    width: 100%;
    max-width: 400px;
    padding: 48px 36px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    animation: ca-up .30s cubic-bezier(.34,1.4,.64,1);
}
.ca-x-btn {
    position: absolute;
    top: 18px; right: 18px;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: #f0f0f0;
    color: #555;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
}
.ca-x-btn:hover { background: #e0e0e0; color: #111; }
.ca-icon-circle {
    width: 108px; height: 108px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
    flex-shrink: 0;
}
.ca-circle-error   { background: color-mix(in srgb, var(--color-danger,   #c0123c) 12%, white); }
.ca-circle-success { background: color-mix(in srgb, var(--color-success,  #16a34a) 12%, white); }
.ca-circle-warning { background: color-mix(in srgb, var(--color-warning,  #d97706) 12%, white); }
.ca-circle-info    { background: color-mix(in srgb, var(--color-info,     #2563eb) 12%, white); }
@supports not (color: color-mix(in srgb, red 10%, white)) {
    .ca-circle-error   { background: #fdeaed; }
    .ca-circle-success { background: #e8f9ef; }
    .ca-circle-warning { background: #fff8e6; }
    .ca-circle-info    { background: #e8f3fd; }
}
.ca-svg { width: 54px; height: 54px; }
.ca-svg-error   { stroke: var(--color-danger,  #c0123c); }
.ca-svg-success { stroke: var(--color-success, #16a34a); }
.ca-svg-warning { stroke: var(--color-warning, #d97706); }
.ca-svg-info    { stroke: var(--color-info,    #2563eb); }
.ca-title {
    font-size: 24px; font-weight: 700; color: #111;
    margin: 0 0 14px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    line-height: 1.2;
}
.ca-message {
    font-size: 15px; color: #555; line-height: 1.7;
    margin: 0 0 32px;
    font-family: 'Segoe UI', system-ui, sans-serif;
}
.ca-pill-btn {
    width: 70%; max-width: 200px;
    padding: 10px 15px;
    border: none; border-radius: 50px;
    background: var(--color-primary, #c0123c);
    color: #fff; font-size: 16px; font-weight: 600;
    letter-spacing: 0.3px; cursor: pointer;
    font-family: 'Segoe UI', system-ui, sans-serif;
    box-shadow: 0 4px 16px color-mix(in srgb, var(--color-primary, #c0123c) 40%, transparent);
    transition: background .15s, transform .1s, box-shadow .15s;
}
.ca-pill-btn:hover {
    background: var(--color-primary-dark, color-mix(in srgb, var(--color-primary, #c0123c) 82%, black));
    transform: translateY(-1px);
}
.ca-pill-btn:active { transform: translateY(0); }
.ca-pill-sm { max-width: 160px; }
.ca-outline-btn {
    padding: 14px 28px;
    border: 1.5px solid #ddd; border-radius: 50px;
    background: #fff; color: #555;
    font-size: 15px; font-weight: 500; cursor: pointer;
    font-family: 'Segoe UI', system-ui, sans-serif;
    transition: background .15s, border-color .15s;
    min-width: 120px;
}
.ca-outline-btn:hover { background: #f5f5f5; border-color: #bbb; }
.ca-two-btns { display: flex; gap: 14px; justify-content: center; width: 100%; }
.ca-toast-stack {
    position: fixed; top: 20px; right: 20px;
    z-index: 10500;
    display: flex; flex-direction: column; gap: 10px;
    pointer-events: none;
}
.ca-toast {
    background: #fff; border-radius: 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.13);
    padding: 14px 18px;
    min-width: 300px; max-width: 380px;
    display: flex; align-items: center; gap: 12px;
    pointer-events: auto;
    animation: ca-up .28s ease;
    border-left: 4px solid var(--color-primary, #c0123c);
    font-family: 'Segoe UI', system-ui, sans-serif;
}
.ca-toast { position: relative; }

.ca-toast-success { border-left-color: var(--color-success, #16a34a); }
.ca-toast-error   { border-left-color: var(--color-danger,  #c0123c); }
.ca-toast-warning { border-left-color: var(--color-warning, #d97706); }
.ca-toast-info    { border-left-color: var(--color-info,    #2563eb); }
.ca-toast { overflow: hidden; }

.ca-toast-progress {
    position: absolute;
    bottom: 0; left: 0;
    height: 3px;
    width: 100%;
    transform-origin: left;
    border-radius: 0;
}
.ca-toast-success .ca-toast-progress { background: var(--color-success, #16a34a); }
.ca-toast-error   .ca-toast-progress { background: var(--color-danger,  #c0123c); }
.ca-toast-warning .ca-toast-progress { background: var(--color-warning, #d97706); }
.ca-toast-info    .ca-toast-progress { background: var(--color-info,    #2563eb); }

@keyframes ca-toast-drain {
    from { transform: scaleX(1); }
    to   { transform: scaleX(0); }
}

.ca-toast-icon  { font-size: 22px; flex-shrink: 0; }
.ca-toast-body  { flex: 1; min-width: 0; }
.ca-toast-title { font-size: 13px; font-weight: 700; color: #111; margin: 0 0 2px; }
.ca-toast-msg   { font-size: 12px; color: #666; margin: 0; }
.ca-toast-close {
    background: none; border: none;
    font-size: 18px; color: #aaa;
    cursor: pointer; padding: 0; flex-shrink: 0;
    transition: color .15s; line-height: 1;
}
.ca-toast-close:hover { color: #333; }
@keyframes ca-out { to { opacity:0; transform: translateX(360px); } }
@media (max-width: 480px) {
    .ca-card { padding: 40px 22px 32px; border-radius: 20px; }
    .ca-toast-stack { left: 16px; right: 16px; }
    .ca-toast { min-width: auto; max-width: none; }
}
</style>

<script>
(function () {
    'use strict';

    var SVG = {
        error:
            '<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>' +
            '<line x1="12" y1="9" x2="12" y2="13"/>' +
            '<circle cx="12" cy="17" r=".5" fill="currentColor"/>',
        success:
            '<polyline points="20 6 9 17 4 12"/>',
        warning:
            '<circle cx="12" cy="12" r="10"/>' +
            '<line x1="12" y1="8" x2="12" y2="12"/>' +
            '<circle cx="12" cy="16" r=".5" fill="currentColor"/>',
        info:
            '<circle cx="12" cy="12" r="10"/>' +
            '<line x1="12" y1="16" x2="12" y2="12"/>' +
            '<circle cx="12" cy="8" r=".5" fill="currentColor"/>'
    };

    var ACFG = {
        error:   { circle: 'ca-circle-error',   stroke: 'ca-svg-error',   title: 'Error'       },
        success: { circle: 'ca-circle-success', stroke: 'ca-svg-success', title: 'Success'     },
        warning: { circle: 'ca-circle-warning', stroke: 'ca-svg-warning', title: 'Warning'     },
        info:    { circle: 'ca-circle-info',    stroke: 'ca-svg-info',    title: 'Information' }
    };

    var CCFG = {
        danger:  { circle: 'ca-circle-error',   stroke: 'ca-svg-error',   title: 'Confirm Action', svgType: 'error'   },
        warning: { circle: 'ca-circle-warning', stroke: 'ca-svg-warning', title: 'Are you sure?',  svgType: 'warning' },
        info:    { circle: 'ca-circle-info',    stroke: 'ca-svg-info',    title: 'Confirmation',   svgType: 'info'    }
    };

    var TICON = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
    var TTTL  = { success: 'Success', error: 'Error', warning: 'Warning', info: 'Information' };

    /* ── showAlert ─────────────────────────────────────────── */
    window.showAlert = function (message, type, title) {
        type = (type && ACFG[type]) ? type : 'error';
        var cfg = ACFG[type];

        document.getElementById('alertIconCircle').className = 'ca-icon-circle ' + cfg.circle;

        var svg = document.getElementById('alertSvg');
        svg.innerHTML = SVG[type];
        svg.setAttribute('class', 'ca-svg ' + cfg.stroke); /* ← setAttribute for SVG */

        document.getElementById('alertTitle').textContent   = title   || cfg.title;
        document.getElementById('alertMessage').textContent = message || '';
        document.getElementById('customAlertOverlay').classList.add('show');
        setTimeout(function () { document.getElementById('alertOkBtn').focus(); }, 120);
    };

    window.closeAlert = function () {
        document.getElementById('customAlertOverlay').classList.remove('show');
    };

    /* ── showConfirm ───────────────────────────────────────── */
    var _confirmCb = null;

    window.showConfirm = function (message, callback, type, title, confirmText, cancelText) {
        type = (type && CCFG[type]) ? type : 'danger';
        var cfg = CCFG[type];

        document.getElementById('confirmIconCircle').className = 'ca-icon-circle ' + cfg.circle;

        var svg = document.getElementById('confirmSvg');
        svg.innerHTML = SVG[cfg.svgType];
        svg.setAttribute('class', 'ca-svg ' + cfg.stroke); /* ← setAttribute for SVG */

        document.getElementById('confirmTitle').textContent     = title       || cfg.title;
        document.getElementById('confirmMessage').textContent   = message     || '';
        document.getElementById('confirmOkBtn').textContent     = confirmText || 'Confirm';
        document.getElementById('confirmCancelBtn').textContent = cancelText  || 'Cancel';

        _confirmCb = callback || null;
        document.getElementById('customConfirmOverlay').classList.add('show');
        setTimeout(function () { document.getElementById('confirmCancelBtn').focus(); }, 120);
    };

    window.closeConfirm = function (confirmed) {
        document.getElementById('customConfirmOverlay').classList.remove('show');
        if (_confirmCb) { _confirmCb(confirmed); _confirmCb = null; }
    };

    /* ── showToast ─────────────────────────────────────────── */
    window.showToast = function (message, type, duration, title) {
        type     = (type && TICON[type]) ? type : 'info';
        duration = (duration === undefined || duration === null) ? 3500 : duration;

        var id   = 'ca-toast-' + Date.now();
        var wrap = document.getElementById('toastContainer');
        var t    = document.createElement('div');
        t.id        = id;
        t.className = 'ca-toast ca-toast-' + type;
        t.innerHTML =
    '<span class="ca-toast-icon">' + TICON[type] + '</span>' +
    '<div class="ca-toast-body">' +
        '<p class="ca-toast-title">' + (title || TTTL[type]) + '</p>' +
        '<p class="ca-toast-msg">'   + (message || '')        + '</p>' +
    '</div>' +
    '<button class="ca-toast-close" onclick="removeToast(\'' + id + '\')" title="Dismiss">&#x2715;</button>' +
    (duration > 0 ? '<div class="ca-toast-progress" style="animation: ca-toast-drain ' + duration + 'ms linear forwards;"></div>' : '');

        wrap.appendChild(t);
        if (duration > 0) setTimeout(function () { removeToast(id); }, duration);
    };

    window.removeToast = function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.style.animation = 'ca-out .28s ease forwards';
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 290);
    };

    /* Override native alert so any legacy calls get the styled modal */
    window.alert = function (msg) { showAlert(String(msg), 'info'); };

    /* ESC + backdrop click */
    document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        var ao = document.getElementById('customAlertOverlay');
        var co = document.getElementById('customConfirmOverlay');
        if (ao && ao.classList.contains('show')) closeAlert();
        if (co && co.classList.contains('show')) closeConfirm(false);
    });

    ['customAlertOverlay', 'customConfirmOverlay'].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('click', function (e) {
            if (e.target !== el) return;
            if (id === 'customAlertOverlay')   closeAlert();
            if (id === 'customConfirmOverlay') closeConfirm(false);
        });
    });

}());
</script>
